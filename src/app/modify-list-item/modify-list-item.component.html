<form class="example-form">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Modify List Item</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <!-- Name Field with Tooltip -->
      <mat-form-field appearance="fill">
        <mat-label>Name</mat-label>
        <input matInput type="text" id="name" placeholder="Enter noodle name" [appHighlightOnFocus]="'lightgreen'"
               matTooltip="Enter the name of the noodle. This should be a short and descriptive name." matTooltipPosition="above" />
      </mat-form-field>

      <!-- Email Field with Tooltip -->
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput type="email" id="email" placeholder="Enter your email" [appHighlightOnFocus]="'lightblue'"
               matTooltip="Provide your email address. Ensure it’s in a valid format like name@example.com." matTooltipPosition="above" />
      </mat-form-field>

      <!-- Password Field with Tooltip -->
      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password" id="password" placeholder="Enter a secure password" [appHighlightOnFocus]="'pink'"
               matTooltip="Enter a secure password with at least 8 characters, including uppercase and special characters." matTooltipPosition="above" />
      </mat-form-field>

      <!-- Submit Button with Tooltip -->
      <button mat-raised-button color="primary" matTooltip="Click to save the changes." matTooltipPosition="above">Save</button>
    </mat-card-content>
  </mat-card>
</form>

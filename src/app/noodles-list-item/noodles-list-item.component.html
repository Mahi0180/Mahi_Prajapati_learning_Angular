<mat-card class="noodle-item-card">
  <mat-card-header>
    <mat-card-title>{{noodle.name | uppercase}}</mat-card-title>
    <mat-card-subtitle>{{noodle.price | currency}}</mat-card-subtitle>
  </mat-card-header>

  <img mat-card-image [src]="noodle.image" alt="{{noodle.name}}">

  <mat-card-actions>
    <button mat-button color="primary">View Details</button>
  </mat-card-actions>
</mat-card>

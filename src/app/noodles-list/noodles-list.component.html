<html>
<body>
<h1>Noodles Shop</h1>
<table>
  <thead>
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Price</th>
    <th>Images</th>
    <th>Manufacture Date</th>
    <th>Expiry Dates</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor ="let noodle of noodles">
    <td>{{noodle.id}}</td>
    <td>{{noodle.name| uppercase}}</td>
    <td>{{noodle.price | currency}}</td>
    <td>{{noodle.manufactureDate | date:'longDate'}}</td>

  </tr>
  </tbody>
</table>
</body>
</html>

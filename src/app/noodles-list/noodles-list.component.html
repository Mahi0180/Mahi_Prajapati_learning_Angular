<html>
<body>
<h1>Noodles Shop</h1>
<table>
  <thead>
  <tr>
    <th>Id</th>
    <th>Name</th>
    <th>Price</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor ="let noodle of noodles" [appHoverHighlight]="'yellow'">
    <td>{{noodle.id}}</td>
    <td>{{noodle.name| uppercase}}</td>
    <td>{{noodle.price | currency}}</td>
  </tr>
  <button [appHoverHighlight]="'lightgreen'">Hover me</button>
  </tbody>
</table>
</body>
</html>
